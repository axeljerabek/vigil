# vaelen - docker-compose.yml
#
# EIN Service, nicht zwei. Das war ursprünglich als zwei getrennte Container
# aufgeteilt (Pipeline + Dashboard) — das ist falsch und wurde korrigiert:
# web_ui.py startet/stoppt recorder_pipeline.py über start_detached.sh /
# stop.sh als eigenen KINDPROZESS (nicht über eine Netzwerk-Schnittstelle
# o.ä.) — das funktioniert nur, wenn beide im selben Prozess-Namespace
# laufen. Mit zwei getrennten Containern sieht web_ui.py die Pipeline gar
# nicht: der Start/Stop-Button im Dashboard geht ins Leere, und die
# Pipeline lief in ihrem eigenen Container stattdessen unkontrolliert von
# Anfang an durch, ohne echte Kamera-Konfiguration mitzubekommen, die man
# erst später über das Dashboard einträgt.
#
# WICHTIG: braucht das NVIDIA Container Toolkit auf dem Host
# (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html)
# und den modernen "docker compose" V2-Plugin-Befehl (ohne Bindestrich).
# Mit dem alten, eigenständigen "docker-compose" (V1) wird die
# GPU-Reservierung unten bei manchen Setups nicht zuverlässig durchgereicht —
# in dem Fall stattdessen `runtime: nvidia` + `NVIDIA_VISIBLE_DEVICES=all`
# als Environment-Variable verwenden (siehe auskommentierte Zeilen unten).
#
# Ollama läuft bewusst NICHT mit in diesem Compose-Stack — falls ihr wie
# Axel schon eine eigene, separate Ollama-Instanz mit vielen Modellen habt,
# einfach OLLAMA_URL in den Dashboard-Settings drauf zeigen lassen.

services:
  vaelen:
    build: .
    image: vaelen:latest
    container_name: vaelen
    command: ["python3", "web_ui.py"]
    restart: unless-stopped
    network_mode: host   # lokale RTMP-Kameras im Heimnetz + Dashboard unter http://<host>:19473
    # NVIDIA_DRIVER_CAPABILITIES zusätzlich zur deploy.resources-Capabilities-
    # Liste unten gesetzt — nicht redundant. Die neuere deploy.resources-
    # Syntax deckt bei manchen NVIDIA-Container-Toolkit-Versionen "video"
    # (und damit libnvidia-encode.so für NVENC) nicht zuverlässig ab, obwohl
    # normales CUDA-Compute (gpu/utility) tadellos funktioniert — genau das
    # beobachtete Symptom (YOLO läuft auf GPU, NVENC schlägt mit "Invalid
    # argument" fehl). Diese Variable ist der ältere, universellere
    # Mechanismus, den mehr Toolkit-Versionen korrekt respektieren.
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, video]
              # gpu+compute: für YOLO/CLAP/Whisper/InsightFace-Inferenz
              # utility: für nvidia-smi (Hardware-Status im Dashboard)
              # video: für NVENC/NVDEC
    # Fallback für ältere/eigenständige docker-compose-Installationen, falls
    # obige Reservierung bei euch nicht greift (auskommentiert lassen, bis
    # ihr das braucht):
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ./config.py:/app/config.py
      - ./pipeline_settings.json:/app/pipeline_settings.json
      - ./stream_overrides.json:/app/stream_overrides.json
      - ./streams.json:/app/streams.json
      - ./search_index.db:/app/search_index.db
      - ./faces.db:/app/faces.db
      - ./alerts:/app/alerts
      - ./logs:/app/logs
      - model-cache:/root/.cache/huggingface       # CLAP/sentence-transformers/Whisper/InsightFace, einmalig heruntergeladen
      - ultralytics-cache:/root/.config/Ultralytics # YOLO-Modell-Konfiguration
      - ./yolo26x.pt:/app/yolo26x.pt                # an eure YOLO_VERSION/MODEL_SIZE-Wahl anpassen

volumes:
  model-cache:
  ultralytics-cache:
