<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 110" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff004c" />
      <stop offset="100%" stop-color="#ff6a00" />
    </linearGradient>
    <linearGradient id="carbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
